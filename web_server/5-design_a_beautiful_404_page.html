<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>404 - Lost in space</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; flex-direction: column;
           align-items: center; justify-content: center; text-align: center;
           background: radial-gradient(circle, #1b2a49, #0b1020);
           color: #fff; font-family: Arial, sans-serif; }
    h1 { font-size: 9rem; margin: 0; letter-spacing: 1rem; }
    p { font-size: 1.5rem; }
    .moon { font-size: 5rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-20px); } }
    a { color: #ffd166; }
  </style>
</head>
<body>
  <div class="moon">&#127765;</div>
  <h1>404</h1>
  <p>Ceci n'est pas une page</p>
  <p>This page drifted off into space. <a href="/">Take me home</a></p>
</body>
</html>
